<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu du rapport d'évaluation</title>
<style>
  :root{--navy:#0F2452;--cyan:#00A9E0;--ink:#0A1A38;--muted:#5B6470;--line:rgba(15,36,82,.12);--bg:#ffffff;}
  *{box-sizing:border-box;}
  .cf-wrap{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);max-width:980px;margin:0 auto;padding:8px 12px 20px;-webkit-user-select:none;user-select:none;}
  .cf-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 2px 14px;}
  .cf-head h2{font-size:17px;font-weight:600;margin:0;letter-spacing:.01em;}
  .cf-hint{font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .cf-stage{position:relative;width:100%;height:0;padding-bottom:42%;perspective:1700px;overflow:hidden;touch-action:pan-y;cursor:grab;}
  .cf-stage.grabbing{cursor:grabbing;}
  .cf-card{position:absolute;top:50%;left:50%;width:62%;margin:0;aspect-ratio:16/9;
    transform-style:preserve-3d;transition:transform .5s cubic-bezier(.22,.61,.36,1),opacity .5s,filter .5s;will-change:transform,opacity;}
  .cf-card img{display:block;width:100%;height:100%;object-fit:cover;border-radius:8px;background:#fff;box-shadow:0 18px 45px rgba(15,36,82,.22);}
  .cf-frame{position:absolute;inset:0;border-radius:8px;border:0.5px solid var(--line);pointer-events:none;}
  .cf-card.is-side{cursor:pointer;}
  .cf-card.is-center img{box-shadow:0 26px 60px rgba(15,36,82,.30);}
  .cf-dots{display:flex;gap:8px;justify-content:center;margin:16px 0 4px;flex-wrap:wrap;}
  .cf-dot{width:8px;height:8px;border-radius:50%;background:rgba(15,36,82,.20);border:0;padding:0;cursor:pointer;transition:background .2s,transform .2s;}
  .cf-dot.on{background:var(--cyan);transform:scale(1.25);}
  .cf-cap{text-align:center;margin:10px auto 0;max-width:560px;min-height:54px;}
  .cf-cap h3{margin:0 0 4px;font-size:16px;font-weight:600;color:var(--navy);}
  .cf-cap p{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted);}
  .cf-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:30;width:42px;height:42px;border-radius:50%;border:0.5px solid var(--line);background:rgba(255,255,255,.92);color:var(--navy);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;backdrop-filter:blur(2px);}
  .cf-nav:hover{background:#fff;}
  .cf-prev{left:6px;} .cf-next{right:6px;}
  @media(max-width:640px){
    .cf-stage{padding-bottom:56%;} .cf-card{width:74%;}
    .cf-head{flex-direction:column;gap:2px;} .cf-hint{font-size:11.5px;}
    .cf-nav{width:36px;height:36px;font-size:17px;}
  }
</style>
</head>

<script>
(function(){
  var META=[{"t": "Page de couverture", "n": "Identité de la mission et date du rapport d'évaluation"}, {"t": "Synthèse de valorisation", "n": "Pont de valeur : des capitaux propres retraités à la valeur des titres (méthode ANR)"}, {"t": "Présentation du groupe", "n": "Constitution du groupe et étapes clés de son développement"}, {"t": "Organigramme", "n": "Structure familiale du groupe et périmètre de valorisation"}, {"t": "Données de marché", "n": "Échantillon de comparables, transactions et coût moyen pondéré du capital"}, {"t": "Multiples de marché", "n": "Multiples d'EBITDA des sociétés comparables du secteur"}, {"t": "Holding", "n": "Analyse détaillée de la holding : résultat, bilan, immobilier, valorisation"}, {"t": "Compte de résultat", "n": "Analyse détaillée du compte de résultat d'une société du groupe"}, {"t": "Contact", "n": "Coordonnées du cabinet et informations complémentaires"}];
  var cards=Array.prototype.slice.call(document.querySelectorAll('.cf-card'));
  var N=cards.length, cur=0;
  var stage=document.getElementById('cfStage');
  var capH=document.querySelector('#cfCap h3'), capP=document.querySelector('#cfCap p');
  var dotsWrap=document.getElementById('cfDots');
  for(var k=0;k<N;k++){(function(k){var d=document.createElement('button');d.className='cf-dot';d.setAttribute('aria-label','Slide '+(k+1));d.addEventListener('click',function(){go(k);});dotsWrap.appendChild(d);})(k);}
  var dots=Array.prototype.slice.call(dotsWrap.children);
  function rel(i){var d=i-cur;while(d>N/2)d-=N;while(d<-N/2)d+=N;return d;}
  function layout(){
    cards.forEach(function(c,i){
      var d=rel(i), ad=Math.abs(d), sign=d<0?-1:1, tx,ry,sc,op,z;
      if(ad===0){tx=0;ry=0;sc=1;op=1;z=50;}
      else if(ad===1){tx=sign*58;ry=-sign*38;sc=.82;op=.92;z=40;}
      else if(ad===2){tx=sign*102;ry=-sign*44;sc=.66;op=.32;z=30;}
      else {tx=sign*135;ry=-sign*46;sc=.55;op=0;z=10;}
      c.style.transform='translate(-50%,-50%) translateX('+tx+'%) rotateY('+ry+'deg) scale('+sc+')';
      c.style.opacity=op; c.style.zIndex=z;
      c.classList.toggle('is-center',ad===0);
      c.classList.toggle('is-side',ad!==0&&op>0);
    });
    dots.forEach(function(dt,i){dt.classList.toggle('on',i===cur);});
    capH.textContent=META[cur].t; capP.textContent=META[cur].n;
  }
  function go(i){cur=((i%N)+N)%N;layout();}
  function next(){go(cur+1);} function prev(){go(cur-1);}
  document.getElementById('cfNext').addEventListener('click',next);
  document.getElementById('cfPrev').addEventListener('click',prev);
  cards.forEach(function(c){c.addEventListener('click',function(e){var d=rel(parseInt(c.dataset.i,10));if(d!==0){e.preventDefault();go(parseInt(c.dataset.i,10));}});});
  var down=false,sx=0,moved=0;
  function start(x){down=true;sx=x;moved=0;stage.classList.add('grabbing');}
  function move(x){if(!down)return;moved=x-sx;}
  function end(){if(!down)return;down=false;stage.classList.remove('grabbing');var th=Math.max(40,stage.clientWidth*0.06);if(moved<=-th)next();else if(moved>=th)prev();}
  stage.addEventListener('pointerdown',function(e){start(e.clientX);});
  window.addEventListener('pointermove',function(e){move(e.clientX);});
  window.addEventListener('pointerup',end);
  stage.tabIndex=0;
  stage.addEventListener('keydown',function(e){if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();});
  var wlock=false;
  stage.addEventListener('wheel',function(e){var dx=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:0;if(!dx)return;e.preventDefault();if(wlock)return;wlock=true;if(dx>0)next();else prev();setTimeout(function(){wlock=false;},420);},{passive:false});
  layout();
})();
</script>
