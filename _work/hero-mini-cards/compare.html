<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comparaison mini cas-usage — A vs B</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #0b1220; color: #fff; font-family: 'Inter', system-ui; }
    header { padding: 14px 22px; display: flex; align-items: baseline; gap: 18px; }
    h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; }
    .hint { font-size: 11px; color: #9ca3af; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #1f2937; height: calc(100vh - 56px); }
    .col { background: #fff; display: flex; flex-direction: column; min-height: 0; }
    .col h2 {
      margin: 0; padding: 9px 14px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      background: #0b1220; color: #9ca3af; flex-shrink: 0;
    }
    iframe { width: 100%; flex: 1; border: 0; display: block; }
    @media (max-width: 1100px) {
      .grid { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Mini cas-usage dans le hero</h1>
    <span class="hint">Variante A (statique) vs B (hover expand) — survol chaque carte pour comparer.</span>
  </header>
  <div class="grid">
    <div class="col">
      <h2>Variante A — statique</h2>
      <iframe src="./variant-a.html" title="Variante A"></iframe>
    </div>
    <div class="col">
      <h2>Variante B — hover expand</h2>
      <iframe src="./variant-b.html" title="Variante B"></iframe>
    </div>
  </div>
</body>
</html>
